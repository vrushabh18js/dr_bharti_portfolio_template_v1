<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Auditorium Stage Background -->
  <path d="M 0 320 Q 400 280 800 320 L 800 520 L 0 520 Z" fill="#0F172A" opacity="0.05"/>
  <circle cx="400" cy="180" r="140" fill="#2563EB" opacity="0.07" />

  <!-- Podium and Speaker Mic -->
  <g transform="translate(330, 120)">
    <!-- Stage Podium -->
    <polygon points="30,120 110,120 125,230 15,230" fill="#1E3A8A"/>
    <rect x="20" y="105" width="100" height="15" rx="4" fill="#3B82F6"/>
    <!-- Mic -->
    <path d="M 70 105 L 70 70 L 60 55" fill="none" stroke="#64748B" stroke-width="4"/>
    <ellipse cx="58" cy="52" rx="7" ry="9" fill="#0F172A"/>
    <!-- Academic Crest on podium -->
    <circle cx="70" cy="165" r="18" fill="#F59E0B" opacity="0.9"/>
    <polygon points="70,154 73,163 82,163 75,169 77,178 70,172 63,178 65,169 58,163 67,163" fill="#FFFFFF"/>
    <!-- Presentation screen in background -->
    <rect x="-140" y="-40" width="160" height="95" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="-130" y="-30" width="90" height="8" rx="4" fill="#2563EB"/>
    <rect x="-130" y="-15" width="130" height="4" rx="2" fill="#94A3B8"/>
    <rect x="-130" y="-5" width="110" height="4" rx="2" fill="#94A3B8"/>
    <path d="M -125 40 L -95 15 L -75 28 L -45 5 L -20 22" fill="none" stroke="#10B981" stroke-width="3"/>
  </g>

  <!-- Banner text -->
  <rect x="120" y="380" width="560" height="85" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0F172A" text-anchor="middle">
    Keynote Address at Global MBA Conclave
  </text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle">
    Delivered Address on "Future-Proofing Business Education in AI Era" (2024)
  </text>
</svg>
