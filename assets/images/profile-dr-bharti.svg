<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="700" fill="url(#bgGrad)" rx="24"/>

  <!-- Academic / Executive Background Geometry -->
  <circle cx="500" cy="120" r="180" fill="#2563EB" opacity="0.07" />
  <circle cx="100" cy="580" r="220" fill="#D97706" opacity="0.06" />
  <path d="M 50 150 L 200 50 L 350 150" stroke="#2563EB" stroke-width="2" fill="none" opacity="0.15" stroke-dasharray="6,6"/>

  <!-- Placeholder Silhouette -->
  <g transform="translate(0, 40)" filter="url(#shadow)">
    <!-- Coat / Shoulders -->
    <path d="M 140 600 Q 160 430 300 420 Q 440 430 460 600 Z" fill="url(#suitGrad)"/>
    <!-- Shirt Collar & Tie -->
    <polygon points="260,420 340,420 300,510" fill="#FFFFFF"/>
    <polygon points="288,435 312,435 305,580 295,580" fill="#2563EB"/>
    <!-- Head / Neck -->
    <rect x="270" y="340" width="60" height="85" fill="#E2E8F0" rx="10"/>
    <ellipse cx="300" cy="280" rx="85" ry="105" fill="#CBD5E1"/>
    <!-- Eyeglasses / Intellectual Accent -->
    <circle cx="270" cy="275" r="22" fill="none" stroke="#1E293B" stroke-width="5"/>
    <circle cx="330" cy="275" r="22" fill="none" stroke="#1E293B" stroke-width="5"/>
    <line x1="292" y1="275" x2="308" y2="275" stroke="#1E293B" stroke-width="5"/>
    <!-- Hair outline -->
    <path d="M 215 260 Q 230 170 300 170 Q 370 170 385 260 C 360 210 240 210 215 260 Z" fill="#1E293B"/>
  </g>

  <!-- Photo upload placeholder label & guidelines -->
  <rect x="110" y="580" width="380" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" stroke-width="2"/>
  <text x="300" y="612" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">
    DR. D. B. BHARTI
  </text>
  <text x="300" y="636" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="middle">
    Head of Department — MBA | Replace with real photo
  </text>

  <!-- Top Badge -->
  <g transform="translate(420, 40)">
    <rect width="140" height="38" rx="19" fill="#1E3A8A"/>
    <circle cx="20" cy="19" r="6" fill="#F59E0B"/>
    <text x="75" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">PROFESSOR</text>
  </g>
</svg>
