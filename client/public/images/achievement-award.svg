<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bgGrad1)"/>
  
  <!-- Decorative rays -->
  <circle cx="400" cy="220" r="160" fill="#2563EB" opacity="0.08" />
  <circle cx="400" cy="220" r="110" fill="#F59E0B" opacity="0.1" />

  <!-- Trophy Illustration -->
  <g transform="translate(340, 120)">
    <!-- Base -->
    <rect x="25" y="180" width="70" height="18" rx="4" fill="#1E293B"/>
    <rect x="35" y="155" width="50" height="25" rx="3" fill="#64748B"/>
    <path d="M 45 155 L 75 155 L 67 115 L 53 115 Z" fill="url(#gold)"/>
    <!-- Cup -->
    <path d="M 25 25 C 25 110 95 110 95 25 Z" fill="url(#gold)"/>
    <!-- Cup rim -->
    <ellipse cx="60" cy="25" rx="35" ry="10" fill="#FDE68A"/>
    <!-- Handles -->
    <path d="M 25 40 C -5 40 -5 85 28 85" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 95 40 C 125 40 125 85 92 85" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <!-- Star on trophy -->
    <polygon points="60,45 64,57 76,57 66,65 70,77 60,69 50,77 54,65 44,57 56,57" fill="#FFFFFF"/>
  </g>

  <!-- Banner text -->
  <rect x="120" y="380" width="560" height="85" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#1E3A8A" text-anchor="middle">
    Excellence in Academic Leadership Award
  </text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#475569" text-anchor="middle">
    Honored by Higher Education Council &amp; Management Federation (2025)
  </text>
</svg>
