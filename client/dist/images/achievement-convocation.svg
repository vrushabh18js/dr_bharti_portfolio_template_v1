<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="16" fill="url(#bgGrad3)"/>
  
  <g transform="translate(320, 110)">
    <!-- Mortarboard Hat -->
    <polygon points="80,40 170,80 80,120 -10,80" fill="#1E1B4B"/>
    <polygon points="15,100 15,145 80,175 145,145 145,100 80,130" fill="#312E81"/>
    <!-- Tassel -->
    <circle cx="80" cy="80" r="6" fill="#F59E0B"/>
    <path d="M 80 80 Q 150 90 160 140" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <rect x="155" y="140" width="10" height="22" rx="3" fill="#D97706"/>
    <!-- Degree Scroll -->
    <g transform="translate(-80, 80) rotate(-20)">
      <rect x="0" y="0" width="120" height="35" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="45" y="-3" width="20" height="41" rx="3" fill="#DC2626"/>
      <line x1="15" y1="12" x2="40" y2="12" stroke="#94A3B8" stroke-width="2"/>
      <line x1="15" y1="22" x2="35" y2="22" stroke="#94A3B8" stroke-width="2"/>
    </g>
  </g>

  <!-- Banner text -->
  <rect x="120" y="380" width="560" height="85" rx="16" fill="#FFFFFF" fill-opacity="0.95" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="400" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#1E1B4B" text-anchor="middle">
    Annual Convocation &amp; MBA Degree Conferral
  </text>
  <text x="400" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle">
    Presided over graduation ceremony for 300+ MBA Postgraduates
  </text>
</svg>
